services:
  - type: web
    name: examvault-backend
    runtime: python
    repo: https://github.com/RikepilB/ExamVault
    rootDir: app/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn examvault.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.12
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: https://exam-vault-five.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://exam-vault-five.vercel.app
      - key: FRONTEND_URL
        value: https://exam-vault-five.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_REQUIRED
        value: "True"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: JWT_SECRET_KEY
        generateValue: true
