<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ExamVault mark: a marked answer bubble on an exam paper -->
  <rect x="4" y="4" width="56" height="56" rx="10" fill="#F7F2E7" stroke="#1B2431" stroke-width="4"/>
  <!-- question number -->
  <text x="12" y="24" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#1B2431">1.</text>
  <!-- bubbles: B is marked -->
  <circle cx="18" cy="44" r="6" fill="none" stroke="#1B2431" stroke-width="3"/>
  <circle cx="34" cy="44" r="7.5" fill="#C1121F"/>
  <circle cx="50" cy="44" r="6" fill="none" stroke="#1B2431" stroke-width="3"/>
</svg>
